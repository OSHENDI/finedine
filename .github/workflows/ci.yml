name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:integration
      - run: npm run build

      # The free host cannot build the site (not enough memory), so it is built here and the result is
      # published to the `release` branch, which the host deploys. Only pushes to main publish.
      - name: Publish the built site to the release branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node scripts/make-release.mjs "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          git init -q -b release
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Release ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" release
